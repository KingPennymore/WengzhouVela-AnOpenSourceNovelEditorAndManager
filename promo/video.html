<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>文舟 Vela 宣传片</title>
<style>
:root{--accent:#8ad0a8;--accent2:#23744e;--ink:#eef6f1;--muted:#a9c2b4;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#08120d;font-family:"HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(1200px 800px at 70% 30%,#1b3a2b 0%,#0f2219 45%,#08120d 100%)}
#glow{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(138,208,168,.16),transparent 60%);left:-300px;top:-500px}
svg#waves{position:absolute;left:0;bottom:0;width:1920px;height:260px}
.scene{position:absolute;inset:0;opacity:0}
.win{position:absolute;border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);background:#fff}
.cam{position:absolute;left:0;top:0;transform-origin:0 0}
.cam img{display:block;width:100%;height:100%}
.layer{position:absolute;inset:0}
.ring{position:absolute;border:3px solid #2fa36b;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,25,18,.0),0 0 24px rgba(47,163,107,.55);opacity:0}
.cap{position:absolute}
.cap>*{opacity:0}
.kicker{font-size:22px;letter-spacing:6px;color:var(--accent);font-weight:600;margin-bottom:22px}
.title{font-size:66px;font-weight:700;line-height:1.2;margin-bottom:28px;letter-spacing:2px}
.body{font-size:27px;line-height:1.75;color:var(--muted);max-width:480px}
.center{text-align:center;left:0;right:0}
.tags{position:absolute}
.center .body{max-width:none}
.phone{position:absolute;border-radius:34px;overflow:hidden;background:#000;box-shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 8px #1c1f1e,0 0 0 9px rgba(255,255,255,.12)}
.phone img{width:100%;height:100%;display:block}
.label{position:absolute;font-size:24px;color:var(--muted);letter-spacing:3px;text-align:center}
.thumb{position:absolute;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.1)}
.thumb img{width:100%;height:100%;display:block}
.tname{position:absolute;font-size:26px;text-align:center;letter-spacing:4px}
.icon{position:absolute;border-radius:28%;overflow:hidden;box-shadow:0 30px 80px rgba(35,116,78,.55)}
.icon img{width:100%;height:100%}
.chip{display:inline-block;padding:10px 26px;border:1px solid rgba(138,208,168,.4);border-radius:999px;margin:0 8px;font-size:24px;color:var(--accent)}
#veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
</style></head>
<body><div id="stage"><div id="glow"></div>
<svg id="waves" viewBox="0 0 1920 260" preserveAspectRatio="none"><path id="w1" fill="rgba(138,208,168,.06)"/><path id="w2" fill="rgba(138,208,168,.05)"/><path id="w3" fill="rgba(47,163,107,.07)"/></svg>
</div><div id="veil"></div>
<script>
const stage=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e;};
const IMG_AR=1350/2160;
const scenes=[];
function scene(a,b,build){const root=el('div','scene');const s={a,b,root,parts:[]};build(s,root);scenes.push(s);return s;}

// caption with staggered entrance
function caption(root,{kicker,title,body,x,y,center,size}){
 const c=el('div','cap'+(center?' center':''),root);c.style.left=center?'0':x+'px';c.style.top=y+'px';
 if(kicker)el('div','kicker',c,kicker);const tt=el('div','title',c,title);if(size)tt.style.fontSize=size+'px';if(body)el('div','body',c,body);
 return c;
}
function animCaption(c,lt,dur,delay=.25){[...c.children].forEach((k,i)=>{const p=easeOut(seg(lt,delay+i*.18,delay+i*.18+.8));k.style.opacity=p;k.style.transform=`translateY(${(1-p)*30}px)`;});}

// screenshot window with camera keyframes [time, cx, cy, zoom] and highlight rings
function windowShot(root,src,{x,y,w},keys,rings=[]){
 const h=w*IMG_AR;const win=el('div','win',root);Object.assign(win.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
 const cam=el('div','cam',win);cam.style.width=w+'px';cam.style.height=h+'px';el('img','',cam).src=src;
 const rs=rings.map(r=>{const d=el('div','ring',cam);Object.assign(d.style,{left:r.x0*w+'px',top:r.y0*h+'px',width:(r.x1-r.x0)*w+'px',height:(r.y1-r.y0)*h+'px'});return {d,r};});
 return {win,cam,w,h,update(lt){
  let k=keys[0];let cx=k[1],cy=k[2],z=k[3];
  for(let i=1;i<keys.length;i++){const p=keys[i-1],q=keys[i];if(lt>=p[0]){const e=ease(seg(lt,p[0],q[0]));cx=p[1]+(q[1]-p[1])*e;cy=p[2]+(q[2]-p[2])*e;z=p[3]+(q[3]-p[3])*e;}}
  cx=clamp(cx,.5/z,1-.5/z);cy=clamp(cy,.5/z,1-.5/z);
  cam.style.transform=`translate(${w/2-cx*w*z}px,${h/2-cy*h*z}px) scale(${z})`;
  rs.forEach(({d,r})=>{const o=Math.min(seg(lt,r.t0,r.t0+.5),1-seg(lt,r.t1-.4,r.t1));d.style.opacity=o;d.style.borderWidth=3/z+'px';const pulse=1+.012*Math.sin(lt*5);d.style.transform=`scale(${1+(1-easeOut(seg(lt,r.t0,r.t0+.6)))*.06}) scale(${pulse})`;});
 }};
}
function entrance(node,lt,from=60,delay=0){const p=easeOut(seg(lt,delay,delay+1));node.style.opacity=p;node.style.transform=`translateY(${(1-p)*from}px)`;}
const S='shots/';
const RIGHT={x:650,y:170,w:1170},FULL={x:280,y:60,w:1360};

// 0 · opening line + logo (0–10)
scene(0,10,(s,root)=>{
 const line=caption(root,{title:'每一部小说，都是一次远航。',center:true,y:470,size:58});
 const icon=el('div','icon',root);Object.assign(icon.style,{left:'870px',top:'250px',width:'180px',height:'180px'});el('img','',icon).src='icon.png';
 const t=caption(root,{title:'文舟 <span style="color:var(--accent);font-weight:300">Vela</span>',body:'开源小说创作与阅读工具',center:true,y:480,size:96});
 const chips=el('div','tags center',root,'<span class="chip">HarmonyOS NEXT</span><span class="chip">Android</span><span class="chip">Windows</span>');chips.style.top='720px';chips.style.opacity=0;
 s.update=lt=>{
  const lp=Math.min(seg(lt,.4,1.6),1-seg(lt,3.2,4));line.style.opacity=1;[...line.children].forEach(k=>{k.style.opacity=lp;k.style.transform=`translateY(${(1-seg(lt,.4,1.6))*20}px)`;k.style.letterSpacing=(2+6*(1-easeOut(seg(lt,.4,3.5))))+'px'});
  const ip=easeOut(seg(lt,4,5.4));icon.style.opacity=ip;icon.style.transform=`scale(${.6+.4*ip}) rotate(${(1-ip)*-8}deg)`;
  animCaption(t,lt,0,4.6);chips.style.opacity=easeOut(seg(lt,6.2,7.2));chips.style.transform=`translateY(${(1-easeOut(seg(lt,6.2,7.2)))*20}px)`;
 };
});
// 1 · one file (10–17.5)
scene(10,17.5,(s,root)=>{
 const w=windowShot(root,S+'01-editor.png',FULL,[[0,.5,.5,1],[7.5,.42,.45,1.12]]);
 const c=caption(root,{title:'一个文件，写完整部小说',center:true,y:935,size:52});
 s.update=lt=>{entrance(w.win,lt,80);w.update(lt);animCaption(c,lt,0,.6);};
});
const feature=(a,b,src,cap,keys,rings,extra)=>scene(a,b,(s,root)=>{
 const w=windowShot(root,src,RIGHT,keys,rings);const c=caption(root,{...cap,x:110,y:330});
 const ex=extra?extra(root):null;
 s.update=lt=>{entrance(w.win,lt,60,.1);w.update(lt);animCaption(c,lt);ex&&ex(lt);};
});
// 2 · chapters (17.5–25)
feature(17.5,25,S+'01-editor.png',{kicker:'01 · 章节',title:'章节<br>自动识别',body:'中文、英文、Markdown 与数字编号标题即写即识别，每章字数一目了然，还能自定义标题模板。'},
 [[0,.5,.5,1],[1.2,.5,.5,1],[3,.86,.42,1.9],[7.5,.86,.5,1.9]],[{t0:3.4,t1:7.4,x0:.808,y0:.275,x1:.992,y1:.34}]);
// 3 · glossary (25–32.5)
feature(25,32.5,S+'05-glossary.png',{kicker:'02 · 设定',title:'术语库<br>同屏可查',body:'人物、地点、船只……正文中的术语自动标注，设定随手翻阅。'},
 [[0,.36,.3,1.7],[3,.36,.3,1.7],[5,.4,.8,1.5],[7.5,.4,.82,1.5]],[{t0:.8,t1:3.2,x0:.105,y0:.258,x1:.31,y1:.286},{t0:4.8,t1:7.4,x0:.005,y0:.69,x1:.79,y1:.92}]);
// 4 · completion (32.5–40)
feature(32.5,40,S+'06-completion.png',{kicker:'03 · 补全',title:'正文名词<br>智能补全',body:'从你写下的文字中学习人名与地名，敲一个字即可补全。全部在本机完成。'},
 [[0,.4,.4,1],[1,.4,.4,1],[3,.22,.42,2.4],[7.5,.21,.42,2.5]],[{t0:3.2,t1:7.4,x0:.108,y0:.38,x1:.29,y1:.46}]);
// 5 · commands (40–47.5)
feature(40,47.5,S+'02-commands.png',{kicker:'04 · 效率',title:'快捷键与<br>命令面板',body:'Ctrl+Shift+K 唤出命令面板；底部八项快捷操作：保存、撤回、章节跳转、Git 提交。'},
 [[0,.5,.5,1],[1,.5,.5,1],[5,.5,.42,1.4],[7.5,.5,.4,1.45]]);
// 6 · markdown (47.5–55)
feature(47.5,55,S+'07-markdown.png',{kicker:'05 · 预览',title:'Markdown<br>即写即看',body:'标题、表格、任务列表与引用实时预览；HTML、CSV、LaTeX 同样支持。'},
 [[0,.55,.4,1],[1,.55,.4,1],[5,.56,.38,1.45],[7.5,.56,.36,1.5]]);
// 7 · reading (55–65)
scene(55,65,(s,root)=>{
 const a=windowShot(root,S+'10-library.png',FULL,[[0,.3,.28,1.5],[4.5,.36,.3,1.6]]);
 const b=windowShot(root,S+'11-reader.png',FULL,[[4,.5,.5,1.25],[10,.5,.45,1]]);
 const c=caption(root,{title:'书库与沉浸阅读',body:'左右翻页 · 双页翻书 · 书签 · 批注 · 全文搜索',center:true,y:915,size:48});c.querySelector('.body').style.fontSize='26px';
 s.update=lt=>{entrance(a.win,lt,80);a.update(lt);b.update(lt);b.win.style.opacity=easeOut(seg(lt,4,5.2));b.win.style.transform=`scale(${1.04-.04*easeOut(seg(lt,4,5.2))})`;animCaption(c,lt,0,.6);};
});
// 8 · github (65–72.5)
feature(65,72.5,S+'12-github.png',{kicker:'06 · 同步',title:'GitHub<br>版本同步',body:'令牌登录、分支管理；拉取与提交先预览差异，整个工作区一次提交，从不强推。'},
 [[0,.5,.4,1],[1,.5,.4,1],[4,.5,.36,1.8],[7.5,.5,.35,1.85]]);
// 9 · .vela & subscriptions (72.5–80)
scene(72.5,80,(s,root)=>{
 const a=windowShot(root,S+'09-vela.png',RIGHT,[[0,.62,.4,1],[3.6,.62,.36,1.3]]);
 const b=windowShot(root,S+'13-subscriptions.png',RIGHT,[[3.4,.3,.28,1.6],[7.5,.28,.26,1.8]]);
 const c=caption(root,{kicker:'07 · 项目',title:'作品配置<br>与仓库订阅',body:'.vela 一处设置名称、字号、标题模板与阅读清单；订阅作者仓库，更新即时提醒。',x:110,y:330});
 s.update=lt=>{entrance(a.win,lt,60,.1);a.update(lt);b.update(lt);b.win.style.opacity=easeOut(seg(lt,3.4,4.4));animCaption(c,lt);};
});
// 10 · themes (80–87.5)
scene(80,87.5,(s,root)=>{
 const c=caption(root,{kicker:'08 · 外观',title:'五套配色 · 深浅双色',center:true,y:90,size:56});
 const names=[['pine','青松'],['jade','玉石'],['bamboo','墨竹'],['wheat','麦田'],['graphite','石墨']];
 const tw=320,th=200,gap=30,x0=(1920-5*tw-4*gap)/2;const items=[];
 names.forEach(([id,n],i)=>['light','dark'].forEach((m,j)=>{const d=el('div','thumb',root);Object.assign(d.style,{left:x0+i*(tw+gap)+'px',top:300+j*(th+40)+'px',width:tw+'px',height:th+'px'});el('img','',d).src=`${S}theme-${id}-${m}.png`;items.push({d,i,j});}));
 const labels=names.map(([,n],i)=>{const l=el('div','tname',root,n);Object.assign(l.style,{left:x0+i*(tw+gap)+'px',width:tw+'px',top:'790px'});return l;});
 const note=el('div','tags center',root,'<div class="body" style="font-size:26px">外观可跟随系统，正文、预览与表格字号随心调节</div>');note.style.top='880px';
 s.update=lt=>{animCaption(c,lt,0,.2);
  items.forEach(({d,i,j})=>{const st=.5+i*.15+j*.25;const p=easeOut(seg(lt,st,st+.9));const hl=i===Math.floor(clamp((lt-3)/0.8,0,4.99))&&lt>3?1:0;d.style.opacity=p;d.style.transform=`translateY(${(1-p)*80}px) scale(${.9+.1*p+hl*.04})`;d.style.boxShadow=hl?'0 0 0 3px #8ad0a8,0 30px 60px rgba(0,0,0,.6)':'';d.style.zIndex=hl?2:1;});
  labels.forEach((l,i)=>{const p=easeOut(seg(lt,1.4+i*.15,2.2+i*.15));l.style.opacity=p;l.style.color=(lt>3&&i===Math.floor(clamp((lt-3)/0.8,0,4.99)))?'#8ad0a8':'#cfe0d6';});
  note.style.opacity=easeOut(seg(lt,2.4,3.2));
 };
});
// 11 · platforms (87.5–95)
scene(87.5,95,(s,root)=>{
 const c=caption(root,{title:'三端同一支笔',body:'HarmonyOS NEXT、Android 与 Windows 共享编辑器，各用原生文件服务与安全凭据存储',center:true,y:70,size:56});
 const d=el('div','win',root);Object.assign(d.style,{left:'110px',top:'300px',width:'980px',height:980*IMG_AR+'px'});el('img','',d).src=S+'25-windows.png';d.firstChild.style.cssText='width:100%;height:100%';
 const ph=[['20-mobile-editor.png',1170],['23-mobile-reader.png',1425],['24-mobile-dark.png',1680]].map(([f,x])=>{const p=el('div','phone',root);Object.assign(p.style,{left:x+'px',top:'300px',width:'220px',height:220*844/390+'px'});el('img','',p).src=S+f;return p;});
 const lab=[['Windows',110,980],['Android',1170,475],['HarmonyOS',1680,220]].map(([t,x,w])=>{const l=el('div','label',root,t);Object.assign(l.style,{left:x+'px',width:w+'px',top:'990px'});return l;});
 s.update=lt=>{animCaption(c,lt,0,.2);entrance(d,lt,80,.5);ph.forEach((p,i)=>entrance(p,lt,120,1+i*.25));lab.forEach((l,i)=>l.style.opacity=easeOut(seg(lt,2+i*.2,2.8+i*.2)));};
});
// 12 · outro (95–107.5)
scene(95,107.5,(s,root)=>{
 const icon=el('div','icon',root);Object.assign(icon.style,{left:'885px',top:'200px',width:'150px',height:'150px'});el('img','',icon).src='icon.png';
 const t=caption(root,{title:'文舟 <span style="color:var(--accent);font-weight:300">Vela</span>',body:'开源 · 本地优先 · 你的文字只属于你',center:true,y:400,size:92});
 const v=el('div','tags center',root,'<span class="chip">v0.9.2 现已发布</span><div class="body" style="margin-top:34px;font-size:24px;color:#7f9a8b">github.com/KingPennymore/WengzhouVela-AnOpenSourceNovelEditorAndManager</div>');v.style.top='700px';
 s.update=lt=>{const ip=easeOut(seg(lt,.3,1.5));icon.style.opacity=ip;icon.style.transform=`scale(${.7+.3*ip})`;animCaption(t,lt,0,.8);v.style.opacity=easeOut(seg(lt,2.2,3.2));};
});

const DURATION=107.5,FADE=.45;
function waves(t){
 const mk=(amp,len,speed,base,phase)=>{let d=`M0 260 L0 ${base}`;for(let x=0;x<=1920;x+=24){d+=` L${x} ${base+amp*Math.sin(x/len+t*speed+phase)+amp*.4*Math.sin(x/(len*.43)-t*speed*1.3)}`;}return d+' L1920 260 Z';};
 document.getElementById('w1').setAttribute('d',mk(18,180,.6,140,0));document.getElementById('w2').setAttribute('d',mk(14,240,-.45,170,2));document.getElementById('w3').setAttribute('d',mk(10,140,.8,205,4));
 const g=document.getElementById('glow');g.style.transform=`translate(${Math.sin(t*.13)*120}px,${Math.cos(t*.1)*60}px)`;
}
window.render=t=>{
 waves(t);
 for(const s of scenes){
  const vis=t>=s.a-FADE&&t<=s.b+FADE;s.root.style.display=vis?'block':'none';if(!vis)continue;
  let o=Math.min(seg(t,s.a-FADE,s.a+FADE),s.b>=DURATION?1:1-seg(t,s.b-FADE,s.b+FADE));if(s.a===0)o=Math.max(o,t<s.a+FADE?1:o);
  s.root.style.opacity=o;s.update(t-s.a);
 }
 document.getElementById('veil').style.opacity=seg(t,0,0)*0+Math.max(1-seg(t,0,.8),seg(t,DURATION-2.5,DURATION));
};
window.DURATION=DURATION;
window.ready=Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));
render(0);
</script></body></html>
