<style>
  /* Noto Serif SC (SIL OFL 1.1), cut down to the characters used here by fonts/subset.py */
  @font-face{font-family:"Promo Serif";src:url("fonts/promo-serif.woff2") format("woff2");font-weight:100 500}
  @font-face{font-family:"Promo Serif";src:url("fonts/promo-serif-bold.woff2") format("woff2");font-weight:600 900}

<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<button id="play" hidden>▶ 播放（含配乐与配音）</button>
<script src="lines.js"></script>
<script src="voice/timing.js"></script>
<script>
// 《炉火祈愿》× 文舟 0.9.9 promo. Every picture is drawn here on a 2D canvas in a flat, low-poly style; renderAt(t)
// draws the frame at t seconds. The soundtrack (music, effects and voice) is mixed by soundtrack.py from the same
// timeline in lines.js. ?t=12.5 shows one frame; without ?record=1 the page plays along with soundtrack.wav.
const P=window.PROMO,VT=window.VOICE_TIMING||{},DURATION=P.duration;window.DURATION=DURATION;
const W=1920,H=1080,canvas=document.getElementById('stage'),ctx=canvas.getContext('2d');
const params=new URLSearchParams(location.search);
const SERIF='"Promo Serif","Source Han Serif SC","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif';
const SANS='"HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif';
const TAU=Math.PI*2;

// ---------------------------------------------------------------- maths and colour
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=p=>p*p*(3-2*p);
const easeOut=p=>1-Math.pow(1-p,3);
const easeIn=p=>p*p*p;
const easeInOut=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const c=1.7,d=c+1;return 1+d*Math.pow(p-1,3)+c*Math.pow(p-1,2);};
const hash=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const noise=x=>{const i=Math.floor(x),f=x-i;return lerp(hash(i),hash(i+1),sm(f));};
const RGB=new Map();
const rgbOf=h=>{let v=RGB.get(h);if(!v){v=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));if(RGB.size<4096)RGB.set(h,v);}return v;};
const toHex=v=>'#'+v.map(x=>Math.round(clamp(x,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,k)=>k<=0?a:k>=1?b:toHex(rgbOf(a).map((v,i)=>v+(rgbOf(b)[i]-v)*k));
const rgba=(h,a)=>`rgba(${rgbOf(h).join(',')},${a})`;
// A global colour wash applied by poly(): scenes use it for dusk, darkness and backlit silhouettes.
const TINT={to:'#000000',k:0};
const tint=c=>TINT.k>0?mix(c,TINT.to,TINT.k):c;
function withTint(to,k,draw){const o={...TINT};TINT.to=o.k>0&&k>0?mix(o.to,to,k/(o.k+k)):k>0?to:o.to;TINT.k=1-(1-o.k)*(1-k);draw();Object.assign(TINT,o);}

// ---------------------------------------------------------------- drawing primitives
function path(p){ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();}
function poly(p,fill){path(p);ctx.fillStyle=tint(fill);ctx.fill();}
function blob(x,y,r,fill,n=7,rot=0,squash=1){const p=[];for(let i=0;i<n;i++){const a=rot+i/n*TAU;p.push(x+Math.cos(a)*r,y+Math.sin(a)*r*squash);}poly(p,fill);}
function limb(a,b,w1,w2,fill){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L;poly([a[0]+nx*w1/2,a[1]+ny*w1/2,b[0]+nx*w2/2,b[1]+ny*w2/2,b[0]-nx*w2/2,b[1]-ny*w2/2,a[0]-nx*w1/2,a[1]-ny*w1/2],fill);}
function rect(x,y,w,h,fill){ctx.fillStyle=tint(fill);ctx.fillRect(x,y,w,h);}
function grad(y0,y1,stops,x0=0,x1=W){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach(([k,c])=>g.addColorStop(k,tint(c)));ctx.fillStyle=g;ctx.fillRect(x0,Math.min(y0,y1),x1-x0,Math.abs(y1-y0));}
function glow(x,y,r,color,a){if(a<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(color,a));g.addColorStop(1,rgba(color,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));}
function fillRR(x,y,w,h,r,c){rr(x,y,w,h,r);ctx.fillStyle=c;ctx.fill();}
function strokeRR(x,y,w,h,r,c,lw=1){rr(x,y,w,h,r);ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.stroke();}
function text(str,x,y,{size=24,weight=400,color='#fff',align='left',font=SANS,a=1,spacing=0,baseline='alphabetic'}={}){
  if(a<=0||!str)return;ctx.save();ctx.globalAlpha*=a;ctx.font=`${weight} ${size}px ${font}`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline=baseline;
  if(spacing)ctx.letterSpacing=spacing+'px';ctx.fillText(str,x,y);ctx.restore();
}
function measure(str,size,weight=400,font=SANS,spacing=0){ctx.save();ctx.font=`${weight} ${size}px ${font}`;if(spacing)ctx.letterSpacing=spacing+'px';const w=ctx.measureText(str).width;ctx.restore();return w;}
const LOGO=new Path2D('M37 129h120l-34 34H70zM95 28v86H43zM111 46l47 68h-47z');

// ---------------------------------------------------------------- scenery
// A low-poly pine standing at (x,y): stacked jagged tiers with a lit facet on the left (light from the upper left).
function pine(x,y,h,col,lite,{seed=0,snow=null,trunk=null}={}){
  const tiers=4+Math.floor(hash(seed*7.3)*2),tw=h*.028;
  poly([x-tw,y+2,x+tw,y+2,x+tw*.55,y-h*.6,x-tw*.55,y-h*.6],trunk||col);
  for(let i=0;i<tiers;i++){
    const k=i/tiers,yb=y-h*(.13+.74*k),yt=i===tiers-1?y-h:yb-h*(.3-.08*k),hw=h*.24*(1-.72*k)*(.88+.24*hash(seed+i*3.1)),ax=x+(hash(seed+i)-.5)*h*.02;
    poly([ax,yt,x+hw,yb,x+hw*.5,yb-h*.045,x+hw*.12,yb+h*.008,x-hw*.32,yb-h*.04,x-hw,yb],col);
    poly([ax,yt,x-hw,yb,x-hw*.32,yb-h*.04,x-hw*.02,yb-h*.11],lite);
    if(snow)poly([ax,yt,x-hw*.62,yt+(yb-yt)*.62,x-hw*.18,yt+(yb-yt)*.5,x+hw*.2,yt+(yb-yt)*.6],snow);
  }
}
// A broad-leafed tree for the spring meadow.
function leafTree(x,y,h,col,lite,dark,seed=0){
  poly([x-h*.035,y+2,x+h*.035,y+2,x+h*.02,y-h*.55,x-h*.02,y-h*.55],dark);
  for(let i=0;i<4;i++){const a=hash(seed+i*2.1)*TAU,r=h*(.16+.07*hash(seed+i)),cx=x+Math.cos(a)*h*.12,cy=y-h*.66+Math.sin(a)*h*.12;blob(cx,cy,r,i%2?col:dark,6,a);}
  blob(x-h*.08,y-h*.74,h*.17,lite,6,.4);blob(x+h*.09,y-h*.6,h*.14,col,6,1.1);
}
// Mountain ridge across the frame, scrolled by `off` (world px) and repeating every `step`.
function ridge(seed,y,amp,col,lite,{step=220,off=0,x0=-300,x1=W+300}={}){
  const i0=Math.floor((x0+off)/step)-1,i1=Math.ceil((x1+off)/step)+1,pts=[x0,H+50];const peaks=[];
  for(let i=i0;i<=i1;i++){const px=i*step-off+(hash(seed+i)-.5)*step*.5,py=y-amp*(.35+.65*hash(seed+i*1.7)),vx=px+step*.5,vy=y-amp*.2*hash(seed+i*2.3);pts.push(px,py,vx,vy);peaks.push([px,py,vx,vy]);}
  pts.push(x1,H+50);poly(pts,col);
  peaks.forEach(([px,py],j)=>{const prev=peaks[j-1];if(!prev)return;poly([px,py,prev[2],prev[3],px-(px-prev[2])*.15,py+(prev[3]-py)*.75+30],lite);});
}
// Ground with an uneven top edge; `bands` adds flat-shaded drifts.
function ground(y,col,{seed=1,amp=14,off=0,bands=null}={}){
  const pts=[-50,H+50];for(let x=-50;x<=W+100;x+=120){pts.push(x,y+(noise((x+off)/300+seed)-.5)*amp*2);}pts.push(W+100,H+50);poly(pts,col);
  if(bands)bands.forEach(([dy,c,s],i)=>{const p=[-50,H+50];for(let x=-50;x<=W+100;x+=160)p.push(x,y+dy+(noise((x+off)/260+seed+i*5+s)-.5)*amp*3);p.push(W+100,H+50);poly(p,c);});
}
function snowfall(t,n,{seed=0,speed=60,wind=-30,size=3,color='#ffffff',alpha=.8,x0=0,y0=0,w=W,h=H}={}){
  ctx.save();ctx.fillStyle=color;
  for(let i=0;i<n;i++){const r=hash(seed+i*1.31),z=.4+.6*hash(seed+i*2.7),x=x0+(((hash(seed+i)*w+t*wind*z+Math.sin(t*.8+i)*12)%w)+w)%w,y=y0+(((r*h+t*speed*z)%h)+h)%h,s=size*z;
    ctx.globalAlpha=alpha*(.4+.6*z);ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.fill();}
  ctx.restore();
}
function shafts(t,a,{color='#ffffff',angle=.55,x=0}={}){
  if(a<=0)return;ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<5;i++){const w=60+hash(i*3)*140,px=x+i*260+hash(i)*120+Math.sin(t*.2+i)*20,al=a*(.05+.06*hash(i*7));ctx.fillStyle=`rgba(255,255,255,${al})`;
    ctx.beginPath();ctx.moveTo(px,-20);ctx.lineTo(px+w,-20);ctx.lineTo(px+w+H*Math.tan(angle),H+20);ctx.lineTo(px+H*Math.tan(angle),H+20);ctx.fill();}
  ctx.restore();
}

// ---------------------------------------------------------------- anatomy toolkit
// Outlines are smooth closed curves (Catmull-Rom through anatomical landmarks) filled flat. A limb segment is traced
// around its bone from a profile [[t, front, back], …]: offsets across the bone at fraction t of its length, front
// being the side the figure faces while the bone hangs down. Ends are rounded so joints close without seams.
function smooth(pts,ten=1){
  const n=pts.length/2,P=i=>[pts[((i%n)+n)%n*2],pts[((i%n)+n)%n*2+1]];ctx.beginPath();ctx.moveTo(pts[0],pts[1]);
  for(let i=0;i<n;i++){const p0=P(i-1),p1=P(i),p2=P(i+1),p3=P(i+2);ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])*ten/6,p1[1]+(p2[1]-p0[1])*ten/6,p2[0]-(p3[0]-p1[0])*ten/6,p2[1]-(p3[1]-p1[1])*ten/6,p2[0],p2[1]);}
  ctx.closePath();
}
function shape(pts,fill){smooth(pts);ctx.fillStyle=tint(fill);ctx.fill();}
function segPts(a,b,prof){
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=uy,ny=-ux,P=(t,o)=>[a[0]+ux*t*L+nx*o,a[1]+uy*t*L+ny*o],out=[];
  const cap=(row,dir)=>{const [t,f,bk]=row,c=(f+bk)/2,r=(f-bk)/2;for(const th of [.8,1.57,2.35]){const along=Math.sin(th)*r*dir,q=P(t,c+Math.cos(th)*r*dir);out.push(q[0]+ux*along,q[1]+uy*along);}};
  for(const [t,f] of prof){const q=P(t,f);out.push(q[0],q[1]);}
  cap(prof[prof.length-1],1);
  for(let i=prof.length-1;i>=0;i--){const q=P(prof[i][0],prof[i][2]);out.push(q[0],q[1]);}
  cap(prof[0],-1);return out;
}
// Lit in the manner of Another World: each part is its shadow tone with a lit block along the front.
const LIT=c=>mix(c,'#fff1dc',.16),SHADE=c=>mix(c,'#000000',.14);
function part(a,b,prof,fill,lit=.55){shape(segPts(a,b,prof),SHADE(fill));if(lit>0)shape(segPts(a,b,prof.map(([t,f,bk])=>[t,f,f-(f-bk)*lit])),LIT(fill));}
function disc(p,r,fill){ctx.beginPath();ctx.arc(p[0],p[1],r,0,TAU);ctx.fillStyle=tint(fill);ctx.fill();}
function capsule(a,b,r1,r2,fill){limb(a,b,r1*2,r2*2,fill);disc(a,r1,fill);disc(b,r2,fill);}
const rot=(q,a)=>[q[0]*Math.cos(a)-q[1]*Math.sin(a),q[0]*Math.sin(a)+q[1]*Math.cos(a)];
const along=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];

// ---------------------------------------------------------------- people
// An adult in profile, facing +x (`face` -1 mirrors): 180 units tall, the head a little under a ninth of that, the
// hip joint at half height. The torso follows the rib cage, waist, sacrum and buttocks; limbs carry the deltoid,
// biceps and forearm, quadriceps, hamstring and calf. Limbs are solved with two-bone IK from hand (wrist) and foot
// (ankle) targets relative to the hip joint, so poses read like puppet keys. Faces are a flat skin silhouette.
const HUM={thigh:44,shin:42,ua:31,fa:26,sole:7};
const POSE={x:0,y:0,s:1,face:1,tor:0,hd:0,hF:[14,-20],hB:[-6,-18],fF:[5,85],fB:[-5,85],ftF:0,ftB:0,cape:0};
const PROFILE={
  thigh:[[0,9,-10],[.2,9.6,-9.2],[.5,8.4,-7.8],[.8,6.8,-6],[1,5.6,-5.2]],
  shin:[[0,5.4,-5.6],[.22,4.6,-8.4],[.42,4.2,-7.6],[.75,3.2,-4.2],[1,3,-3.4]],
  boot:[[0,5,-7.2],[.5,4.2,-5.2],[1,4,-4.4]],
  ua:[[0,6.6,-7],[.18,6.4,-6.4],[.5,5.2,-5.4],[.85,4.3,-4.4],[1,4,-4]],
  fa:[[0,4.2,-4.3],[.25,5,-4.6],[.7,3.4,-3.3],[1,2.9,-2.9]],
  hand:[[0,2.9,-2.9],[.45,3.6,-3.3],[.8,3.1,-2.3],[1,1.4,-1]],
};
// torso, hip joint at the origin: pubis, abdomen, rib cage and chest in front; buttocks, sacrum, lumbar curve,
// shoulder blades and trapezius behind
const TORSO=[4,10,9,4,10.5,-6,10.8,-17,10.2,-26,11.6,-33,14,-41,13.2,-48,10.2,-54,7,-58,5,-61,-6,-63,-9.4,-58,-12.6,-50,-12.6,-40,-11,-30,-9,-20,-10.6,-8,-13.2,-2,-14,4,-11.4,12,-3,13];
// head and neck about the base of the neck: throat, chin, lips, nose, brow, crown, occiput, nape
const HEAD=[6.4,2,5.6,-3.4,4,-7.2,7.8,-8.6,10.2,-10,9.7,-11.6,10.5,-12.7,10,-13.5,10.7,-14.5,10.3,-15.8,12.6,-17.2,9.8,-20.6,10.2,-22,9.4,-25.6,6.2,-29.4,0,-31.4,-6.2,-30,-9.6,-25.4,-10,-19.6,-8.2,-14.6,-6.6,-10.6,-7,-4,-8,2];
const HAIR=[-5.8,-11.2,-9,-14.5,-10.4,-20,-10,-25.8,-6.6,-30.6,0,-32.2,6.6,-30.2,9.8,-26,7.4,-26.6,3,-27.4,-1,-25.2,-3.6,-20,-4.4,-14];
const BEARD=[3.2,-7.2,7.8,-8.6,10.6,-10.2,10.8,-12.6,9.2,-13.4,5.4,-12.4,1.6,-15.2,-1.4,-12,0,-8.4];
const HAT=[-11,-16.5,-10.8,-25,-7,-31.6,0,-33.8,7,-31.8,10.8,-26.6,11.2,-23.6,4,-24.8,-4,-23,-8,-19.8];
const FLAP=[-6.8,-22,.4,-23,.2,-12.6,-2.4,-10.6,-5.4,-12.4];
function lerpPose(a,b,k){const o={...a};for(const key in b){const v=a[key]??POSE[key],w=b[key];o[key]=Array.isArray(w)?w.map((x,i)=>lerp(v[i],x,k)):typeof w==='number'&&typeof v==='number'?lerp(v,w,k):w;}return o;}
function keyed(t,keys,ease=easeInOut){
  const full=keys.map(([kt,p])=>[kt,{...POSE,...p}]);
  if(t<=full[0][0])return full[0][1];
  for(let i=1;i<full.length;i++)if(t<full[i][0]){const [t0,p0]=full[i-1],[t1,p1]=full[i];return lerpPose(p0,p1,ease((t-t0)/(t1-t0)));}
  return full[full.length-1][1];
}
function ik(a,b,l1,l2,pref){
  const dx=b[0]-a[0],dy=b[1]-a[1],d=clamp(Math.hypot(dx,dy),Math.abs(l1-l2)+.01,l1+l2-.01),th=Math.atan2(dy,dx),al=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const c1=[a[0]+Math.cos(th+al)*l1,a[1]+Math.sin(th+al)*l1],c2=[a[0]+Math.cos(th-al)*l1,a[1]+Math.sin(th-al)*l1];
  const side=c=>Math.sign(((c[0]-a[0])*dy-(c[1]-a[1])*dx)||1),e=side(c1)===pref?c1:c2;
  const ang=Math.atan2(b[1]-e[1],b[0]-e[0]);return [e,[e[0]+Math.cos(ang)*l2,e[1]+Math.sin(ang)*l2]];
}
const STYLE={
  soldier:{skin:'#b88f73',shirt:'#3e4a3c',vest:'#3b2c22',pants:'#2b3039',boot:'#1c1a19',hair:'#4a3527',hat:'#2f3433',flap:'#3d3a36'},
  boy:{skin:'#c99b7c',shirt:'#55634e',vest:'#6b4a32',pants:'#3a3f47',boot:'#2a211c',hair:'#6b4a2f'},
  smith:{skin:'#b98a6a',shirt:'#5d4433',vest:'#3a2a20',pants:'#33302d',boot:'#211b17',hair:'#4b3a2c',beard:'#5a4332'},
  smithCoat:{skin:'#b98a6a',shirt:'#4a4440',vest:'#5a4636',pants:'#33302d',boot:'#211b17',hair:'#4b3a2c',beard:'#5a4332'},
};
function foot(a,ft,fill){ctx.save();ctx.translate(a[0],a[1]);ctx.rotate(ft);shape([-4,-4,-6.6,1.4,-5.8,7,6,7,18,7,20.6,5.2,17.4,1.6,8,-1.2,3.6,-5],fill);ctx.restore();}
function human(p,st,{parts='all',hold=null,sil=0,silCol='#11161d'}={}){
  const C=c=>mix(c,silCol,sil),D=c=>mix(C(c),'#000000',.22);
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s*p.face,p.s);
  const shF=rot([1,-53],p.tor),shB=[shF[0]-3,shF[1]+1];
  const [eF,wF]=ik(shF,p.hF,HUM.ua,HUM.fa,-1),[eB,wB]=ik(shB,p.hB,HUM.ua,HUM.fa,-1);
  const [kF,aF]=ik([2,0],p.fF,HUM.thigh,HUM.shin,1),[kB,aB]=ik([-2,0],p.fB,HUM.thigh,HUM.shin,1);
  const J={shF,shB,eF,wF,eB,wB,kF,aF,kB,aB};
  const arm=(sh,e,w,shirt,skin)=>{part(sh,e,PROFILE.ua,shirt);part(e,w,PROFILE.fa,shirt);const d=[w[0]-e[0],w[1]-e[1]],l=Math.hypot(d[0],d[1])||1;part(along(w,e,.06),[w[0]+d[0]/l*16,w[1]+d[1]/l*16],PROFILE.hand,skin);};
  const leg=(hip,k,a,ft,pants,boot)=>{part(hip,k,PROFILE.thigh,pants);part(k,a,PROFILE.shin,pants);part(along(k,a,.5),a,PROFILE.boot,boot);foot(a,ft,boot);};
  if(parts!=='arm'){
    hold?.('back',J);
    arm(shB,eB,wB,D(st.shirt),D(st.skin));
    leg([-2,0],kB,aB,p.ftB,D(st.pants),D(st.boot));
    ctx.save();ctx.rotate(p.tor);
    shape(TORSO,SHADE(C(st.shirt)));
    ctx.save();smooth(TORSO);ctx.clip();
    poly([-1,-64,30,-64,30,-40,-3,-40],LIT(C(st.shirt)));
    poly([-20,2,20,2,20,-44,9,-55,-1,-58,-20,-53],SHADE(C(st.vest)));poly([-2,2,20,2,20,-44,9,-55,-1,-58,-4,-40],LIT(C(st.vest)));
    rect(-20,2,40,20,SHADE(C(st.pants)));rect(-1,2,30,20,LIT(C(st.pants)));rect(-20,-3.6,40,5.6,C('#1d1915'));
    ctx.restore();
    ctx.translate(0,-59.5);ctx.rotate(p.hd);
    shape(HEAD,SHADE(C(st.skin)));ctx.save();smooth(HEAD);ctx.clip();poly([1,4,20,4,20,-40,1,-40,-1,-20],LIT(C(st.skin)));ctx.restore();
    if(st.beard)shape(BEARD,C(st.beard));

    ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=12;
    zh.forEach((line,i)=>text(line,W/2,y+i*50,{size:36,weight:500,color:'#f7f4ee',align:'center',font:SERIF,spacing:1}));
    en.forEach((line,i)=>text(line,W/2,y+(zh.length-1)*50+44+i*30,{size:21,color:'rgba(236,238,240,.9)',align:'center',font:'Georgia,"Times New Roman",serif'}));
    ctx.restore();}
}
// Break a Chinese line at punctuation so each part fits; English lines break between words.
function wrapZh(str,size,max){if(measure(str,size,500,SERIF)<=max)return [str];const cut=[...str.matchAll(/[，、；]/g)].map(m=>m.index+1),mid=str.length/2;const at=cut.sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid))[0]||Math.ceil(mid);return [str.slice(0,at),str.slice(at)];}
function wrapEn(str,size,max){const out=[];let cur='';for(const w of str.split(' ')){const next=cur?cur+' '+w:w;if(cur&&measure(next,size,400,'Georgia,serif')>max){out.push(cur);cur=w;}else cur=next;}out.push(cur);return out;}
// When a cue word is spoken: proportional to its place in the English line.
function cue(id,word){const l=P.lines.find(x=>x.id===id),i=l.en.indexOf(word);return l.at+(VT[id]??(l.end-l.at))*(i<0?0:i/l.en.length);}
// Gallop phase (strides) from the shared rate curve [t, strides per second].
function gallopPhase(t){const g=P.gallop;let ph=0;for(let i=1;i<g.length;i++){const [t0,r0]=g[i-1],[t1,r1]=g[i];if(t<=t0)break;const e=Math.min(t,t1),k=(e-t0)/(t1-t0);ph+=(e-t0)*(r0+(r0+(r1-r0)*k))/2;}return ph;}
function gallopRate(t){const g=P.gallop;for(let i=1;i<g.length;i++)if(t<g[i][0]){const [t0,r0]=g[i-1],[t1,r1]=g[i];return lerp(r0,r1,(t-t0)/(t1-t0));}return 0;}

// ---------------------------------------------------------------- sparks (forge)
function sparkBurst(t,t0,ox,oy,{n=46,seed=0,scale=1,spread=1}={}){
  const age=t-t0;if(age<0||age>2.4)return;
  for(let i=0;i<n;i++){const r=hash(seed+i*3.7),a=-Math.PI/2+(hash(seed+i)-.5)*Math.PI*1.25*spread,v=(260+520*hash(seed+i*1.9))*scale,life=.5+1.6*r;if(age>life)continue;
    const k=age/life,x=ox+Math.cos(a)*v*age,y=oy+Math.sin(a)*v*age+900*scale*age*age,col=k<.2?mix('#fffbe8','#ffd45a',k/.2):k<.6?mix('#ffd45a','#ff7a1e',(k-.2)/.4):mix('#ff7a1e','#5a1a08',(k-.6)/.4),sz=(3+4*hash(seed+i*5))*scale*(1-k*.6);
    ctx.save();ctx.translate(x,y);ctx.rotate(a+age*6*(r-.5));ctx.globalAlpha=1-k*k;poly([-sz*2,0,0,-sz*.7,sz*1.6,0,0,sz*.7],col);ctx.restore();}
}
